%[site;title=Attendance-Administration;content=!FOLLOWS]
<main class="attendance">
  <nav>%[admin_nav]</nav>
  <h1>Attendance verwalten</h1>
  <p class="intro">Bereiche und QR-Codes für die Anwesenheitserfassung verwalten.</p>

  <form id="location-form" class="attendance-location-form">
    <input type="hidden" name="id" value="">
    <label>Code <input name="code" required maxlength="32" autocomplete="off"></label>
    <label>Name <input name="name" required maxlength="120"></label>
    <label>Typ
      <select name="type">
        <option value="LOCATION">Aufenthaltsort</option>
        <option value="ARRIVAL">Ankunft</option>
      </select>
    </label>
    <label>Reihenfolge <input name="displayOrder" type="number" value="0" min="0"></label>
    <label><input name="active" type="checkbox" checked> Aktiv</label>
    <button type="submit">Speichern</button>
    <button type="button" id="reset">Zurücksetzen</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <div class="table-wrap">
    <table>
      <caption>Bereiche und ihre dynamischen QR-/Display-Einstiege</caption>
      <thead><tr><th>Code</th><th>Name</th><th>Typ</th><th>Status</th><th>Reihenfolge</th><th>QR / Display</th><th>Bearbeiten</th></tr></thead>
      <tbody id="locations"></tbody>
    </table>
  </div>
</main>
