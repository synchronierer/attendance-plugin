%[site;title=Attendance;content=!FOLLOWS]
<main class="attendance">
<nav>%[teacher_other_nav]</nav>
<h1>Attendance – Heute / Jetzt</h1>
<form id="filters"><label>Datum <input id="date" type="date"></label><label>Unterrichtsstunde <select id="lesson"><option value="0">Jetzt</option><option value="1">1. Stunde</option><option value="2">2. Stunde</option><option value="3">3. Stunde</option><option value="4">4. Stunde</option><option value="5">5. Stunde</option><option value="6">6. Stunde</option></select></label><label>Bereich <select id="location"><option value="">Alle</option></select></label><label>Klassen <select id="classes" multiple size="4"></select></label><label>Schüler <input id="search" type="search" placeholder="Name suchen"></label><button type="submit">Anzeigen</button><button type="button" id="save">Arbeitsfilter speichern</button></form>
<p id="status" role="status"></p><div class="table-wrap"><table><thead><tr><th><input id="all" type="checkbox" aria-label="Alle auswählen"></th><th>Schüler</th><th>Klasse</th><th>Angekommen</th><th>Aktueller Standort</th><th>Seit</th><th>Quelle</th></tr></thead><tbody id="rows"></tbody></table></div><button id="manual" type="button">Als anwesend bestätigen</button></main>
<style>.attendance{max-width:90rem;margin:auto;padding:1rem}.attendance form{display:flex;gap:1rem;align-items:end;flex-wrap:wrap}.attendance label{display:grid;gap:.25rem}.attendance input,.attendance select,.attendance button{font:inherit;padding:.45rem}.table-wrap{overflow:auto}.attendance table{width:100%;border-collapse:collapse;margin:1rem 0}.attendance th,.attendance td{text-align:left;padding:.6rem;border-bottom:1px solid #ccc}</style><script src="/attendance.js"></script>
