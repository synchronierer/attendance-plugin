%[site;title=Attendance;content=!FOLLOWS]
<main class="attendance"><nav>%[teacher_other_nav]</nav><h1>Attendance – Schulübersicht</h1>
<form id="filters" class="filters"><label>Datum<input id="date" type="date"></label><label>Zeitbezug<select id="lesson"><option value="0">Jetzt</option><option value="1">1. Stunde</option><option value="2">2. Stunde</option><option value="3">3. Stunde</option><option value="4">4. Stunde</option><option value="5">5. Stunde</option><option value="6">6. Stunde</option><option value="7">7. Stunde</option><option value="8">8. Stunde</option><option value="9">9. Stunde</option></select></label><label>Aktueller Standort<select id="location"><option value="">Alle Standorte</option></select></label><label>Status<select id="attendance-status"><option value="all">Alle</option><option value="arrived">Angekommen</option><option value="absent">Nicht angekommen</option></select></label><label>Klassen<select id="classes" multiple size="4" aria-label="Mehrere Klassen auswählen"></select></label><label class="search">Schüler suchen<input id="search" type="search" placeholder="Name suchen"></label><div class="actions"><button type="submit">Aktualisieren</button><button type="button" id="reset">Filter zurücksetzen</button><button type="button" id="save">Arbeitsfilter speichern</button></div></form>
<p id="status" role="status"></p><section class="summary" aria-label="Zusammenfassung"><div><strong id="total">0</strong><span>Gesamt</span></div><div><strong id="arrived">0</strong><span>Angekommen</span></div><div><strong id="absent">0</strong><span>Nicht angekommen</span></div></section><div class="table-wrap"><table><thead><tr><th><input id="all" type="checkbox" aria-label="Alle sichtbaren auswählen"></th><th>Schüler</th><th>Klasse</th><th>Angekommen</th><th>Aktueller Standort</th><th>Seit</th><th>Quelle</th></tr></thead><tbody id="rows"></tbody></table></div><button id="manual" type="button">Als anwesend bestätigen</button></main>
<style>.attendance{max-width:96rem;margin:auto;padding:1rem 1.5rem}.attendance h1{margin:.7rem 0 1rem}.filters{display:flex;gap:.8rem;align-items:end;flex-wrap:wrap;padding:1rem;background:#f5f7fa;border:1px solid #d9e0e6;border-radius:.6rem}.filters label{display:grid;gap:.3rem;font-weight:600}.filters .search{min-width:14rem}.filters input,.filters select,.filters button{font:inherit;padding:.48rem}.filters select[multiple]{min-width:9rem}.actions{display:flex;gap:.5rem;align-items:end;flex-wrap:wrap}.actions button,#manual{cursor:pointer}.attendance #status{min-height:1.3rem}.summary{display:flex;gap:1rem;margin:1rem 0}.summary div{min-width:9rem;padding:.65rem .9rem;border:1px solid #d9e0e6;border-radius:.5rem;background:#fff}.summary strong,.summary span{display:block}.summary strong{font-size:1.5rem}.summary span{color:#52616b}.table-wrap{overflow:auto;max-height:60vh}.attendance table{width:100%;border-collapse:collapse;margin:.5rem 0 1rem}.attendance th,.attendance td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid #d9e0e6;white-space:nowrap}.attendance tbody tr.arrived{background:#eef8f0}.attendance tbody tr.absent{background:#fff7f7}.badge{font-weight:700}.badge.yes{color:#176b35}.badge.no{color:#8d2432}.empty{text-align:center;color:#65757f;padding:1.5rem!important}@media(max-width:800px){.attendance{padding:.75rem}.summary{gap:.4rem}.summary div{min-width:0;flex:1}.table-wrap{max-height:none}}</style><script src="/attendance.js"></script>
